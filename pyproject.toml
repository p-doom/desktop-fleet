[project]
name = "env-fleet"
version = "0.1.0"
description = "Slurm-native, capacity-aware fleet management for verifiers env-servers."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "msgpack>=1.0",
    "python-dotenv>=1.2.2",
    "pyzmq>=26.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
env-fleet = "env_fleet.supervise:main"
env-fleet-ready = "env_fleet.readiness:main"
env-fleet-broker = "env_fleet.broker:main"
env-fleet-prime-rl = "env_fleet.adapters.prime_rl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["env_fleet"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
  "E501", # https://docs.astral.sh/ruff/faq/#is-the-ruff-linter-compatible-with-black
  "N803", # https://docs.astral.sh/ruff/rules/invalid-argument-name
  "N806", # https://docs.astral.sh/ruff/rules/non-lowercase-variable-in-function
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pep8-naming
  "N",
  # pyupgrade
  "UP",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["tests/"]
explicit_package_bases = true
no_implicit_optional = true
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["msgpack", "msgpack.*", "tomli_w"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".git", ".pytest_cache"]
