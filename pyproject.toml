[project]
name = "desktop-fleet"
version = "0.1.0"
description = "Slurm-native, capacity-aware fleet management for verifiers env-servers."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    # The producer of the status file this package routes on. The dependency
    # runs one way only: `desktop` must not learn what a fleet is, or it stops
    # being usable against one VM with no scheduler.
    "desktop",
    "msgpack>=1.0",
    "python-dotenv>=1.2.2",
    "pyzmq>=26.0",
    "tomli-w>=1.2.0",
]

[tool.uv.sources]
# The sibling distribution in this repository. Required, not a convenience:
# PyPI's `desktop` 0.4.2 is a different package with the same name, so a resolve
# that reaches the index installs that one instead.
desktop = { path = "..", editable = true }

[project.scripts]
desktop-fleet = "desktop_fleet.supervise:main"
desktop-fleet-ready = "desktop_fleet.readiness:main"
desktop-fleet-broker = "desktop_fleet.broker:main"
desktop-fleet-prime-rl = "desktop_fleet.adapters.prime_rl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desktop_fleet"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
  "E501", # https://docs.astral.sh/ruff/faq/#is-the-ruff-linter-compatible-with-black
  "N803", # https://docs.astral.sh/ruff/rules/invalid-argument-name
  "N806", # https://docs.astral.sh/ruff/rules/non-lowercase-variable-in-function
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pep8-naming
  "N",
  # pyupgrade
  "UP",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["tests/"]
explicit_package_bases = true
no_implicit_optional = true
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["msgpack", "msgpack.*", "tomli_w"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".git", ".pytest_cache"]
